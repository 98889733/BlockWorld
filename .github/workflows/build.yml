
name: RADAR ZIP to APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Unpack and Build RADAR APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          command -v unzip || (
            apt-get update &&
            apt-get install -y unzip
          )

      - name: Find and unpack ZIP
        run: |
          mkdir -p /tmp/radar-unpacked

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "*.zip" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP archive found!"
            exit 1
          fi

          echo "Found archive: $ZIP"

          unzip -oq "$ZIP" -d /tmp/radar-unpacked

          PROJECT=$(find /tmp/radar-unpacked \
            -name project.godot \
            -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found in ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project found: $PROJECT_DIR"

      - name: Check Android export preset
        run: |
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg missing!"
            exit 1
          fi

          echo "Android export preset found!"

      - name: Prepare project
        run: |
          mkdir -p "$PROJECT_DIR/.godot"
          chmod -R u+rwX "$PROJECT_DIR/.godot"

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Build Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/RADAR.apk"

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-ANDROID-APK
          path: build/RADAR.apk
          if-no-files-found: error
          retention-days: 14
          
