
name: RADAR APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare permissions
        run: |
          mkdir -p .godot/editor build
          chmod -R 777 .godot build

      - name: Check export preset
        run: |
          test -f export_presets.cfg || {
            echo "ERROR: export_presets.cfg is missing"
            exit 1
          }

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          godot --headless --path . \
          --export-debug "Android" build/RADAR.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-APK
          path: build/RADAR.apk
          if-no-files-found: error
          
